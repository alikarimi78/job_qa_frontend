server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: all non-file paths serve the SPA shell
    location / {
        try_files $uri /index.html;
    }

    # API proxy: /api/search -> api:8000/search (trailing slash strips /api/)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # LLM answers can take a while
    }
}
