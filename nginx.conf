server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: all non-file paths serve the SPA shell
    location / {
        try_files $uri /index.html;
    }

    # The shell is the one file that must never be cached: it names the content-hashed
    # bundle, so a browser holding yesterday's copy goes on loading yesterday's bundle
    # after a deploy — which looks exactly like the change not having shipped. Nothing
    # here declared a cache policy at all, and a browser with no `Cache-Control` to read
    # falls back to a heuristic of its own.
    #
    # The `try_files` above ends in a URI rather than a file, so a deep link
    # (`/manage/accounts`) is internally redirected and re-enters location matching here.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # The opposite rule for the bundle, and for the same reason: its name *is* the hash
    # of its content, so it can be cached forever — a new build produces a new name
    # rather than a new version of this one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API proxy: /api/search -> api:8000/search (trailing slash strips /api/)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # LLM answers can take a while
    }
}
