<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Minimal line-art magnifier analyzing job data with a neural network">
  <defs>
    <linearGradient id="cBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="cRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="cBlob">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lens"><circle cx="320" cy="240" r="128"/></clipPath>
  </defs>

  <circle cx="320" cy="240" r="230" fill="url(#cBlob)"/>

  <!-- neural network (right side) -->
  <g stroke="#6366F1" stroke-width="2" opacity="0.35" fill="none">
    <path d="M596 108 L664 168 M596 108 L586 214 M664 168 L586 214 M664 168 L700 274 M586 214 L640 308 M700 274 L640 308 M640 308 L724 378 M700 274 L724 378 M586 214 L508 300"/>
  </g>
  <g fill="#FFFFFF" stroke="#6366F1" stroke-width="3">
    <circle cx="596" cy="108" r="9"/>
    <circle cx="664" cy="168" r="9"/>
    <circle cx="586" cy="214" r="11"/>
    <circle cx="700" cy="274" r="9"/>
    <circle cx="640" cy="308" r="9"/>
    <circle cx="724" cy="378" r="9"/>
  </g>
  <circle cx="586" cy="214" r="5" fill="#F59E0B" stroke="none"/>
  <circle cx="664" cy="168" r="4" fill="#0EA5E9" stroke="none"/>

  <!-- magnifier lens content -->
  <g clip-path="url(#lens)">
    <rect x="192" y="112" width="256" height="256" fill="#FFFFFF" opacity="0.65"/>
    <g opacity="0.5" stroke="#CBD5E1" stroke-width="2">
      <path d="M192 200 H448 M192 248 H448 M192 296 H448"/>
    </g>
    <rect x="240" y="266" width="26" height="46" rx="9" fill="url(#cBar)"/>
    <rect x="282" y="238" width="26" height="74" rx="9" fill="url(#cBar)"/>
    <rect x="324" y="258" width="26" height="54" rx="9" fill="url(#cBar)"/>
    <rect x="366" y="216" width="26" height="96" rx="9" fill="#F59E0B"/>
    <path d="M240 200 L296 176 L340 192 L392 148" fill="none" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#FFFFFF" stroke="#0EA5E9" stroke-width="3">
      <circle cx="296" cy="176" r="6"/><circle cx="340" cy="192" r="6"/><circle cx="392" cy="148" r="6"/>
    </g>
    <path d="M232 330 H400" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- magnifier frame -->
  <circle cx="320" cy="240" r="128" fill="none" stroke="url(#cRing)" stroke-width="12"/>
  <path d="M412 332 L486 406" stroke="#4F46E5" stroke-width="22" stroke-linecap="round"/>
  <path d="M412 332 L486 406" stroke="#818CF8" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

  <!-- job tag entering the lens -->
  <g>
    <rect x="58" y="392" width="196" height="54" rx="27" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
    <circle cx="94" cy="419" r="12" fill="none" stroke="#4F46E5" stroke-width="3"/>
    <rect x="122" y="408" width="100" height="9" rx="4.5" fill="#334155" opacity="0.7"/>
    <rect x="122" y="424" width="62" height="7" rx="3.5" fill="#94A3B8" opacity="0.75"/>
  </g>
  <path d="M256 412 C 296 400 300 388 306 372" fill="none" stroke="#4F46E5" stroke-width="3" stroke-dasharray="1 10" stroke-linecap="round" opacity="0.6"/>

  <!-- accents -->
  <g fill="#F59E0B" opacity="0.9">
    <path d="M124 122 c2.8 11.2 5.6 14 16.8 16.8 c-11.2 2.8 -14 5.6 -16.8 16.8 c-2.8 -11.2 -5.6 -14 -16.8 -16.8 c11.2 -2.8 14 -5.6 16.8 -16.8 Z"/>
  </g>
  <g fill="#0EA5E9" opacity="0.7">
    <circle cx="470" cy="118" r="7"/><circle cx="500" cy="86" r="4"/><circle cx="446" cy="82" r="4"/>
  </g>
</svg>
