<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" role="img" aria-label="AI-powered job analysis illustration">
  <defs>
    <linearGradient id="gCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="gBar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="blobA">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4338CA" flood-opacity="0.16"/>
    </filter>
    <filter id="softSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4338CA" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- background atmosphere -->
  <circle cx="690" cy="470" r="130" fill="url(#blobA)"/>
  <circle cx="110" cy="150" r="150" fill="url(#blobB)"/>
  <g fill="#8B5CF6" opacity="0.22">
    <circle cx="86" cy="316" r="4"/><circle cx="126" cy="346" r="3"/><circle cx="66" cy="366" r="3"/>
    <circle cx="738" cy="196" r="4"/><circle cx="706" cy="160" r="3"/><circle cx="756" cy="236" r="3"/>
    <circle cx="392" cy="530" r="4"/><circle cx="432" cy="552" r="3"/>
  </g>

  <!-- flow connectors -->
  <path d="M292 416 C 332 410 330 358 344 316" fill="none" stroke="url(#gLine)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 12" opacity="0.65"/>
  <path d="M452 198 C 478 176 496 158 516 150" fill="none" stroke="url(#gLine)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 12" opacity="0.65"/>
  <circle cx="332" cy="366" r="5" fill="#8B5CF6"/>
  <circle cx="486" cy="166" r="5" fill="#06B6D4"/>

  <!-- AI core -->
  <circle cx="400" cy="250" r="150" fill="url(#glow)"/>
  <circle cx="400" cy="250" r="126" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="6 10" opacity="0.35"/>
  <circle cx="400" cy="250" r="146" fill="none" stroke="#06B6D4" stroke-width="2" stroke-dasharray="3 14" opacity="0.25"/>
  <path d="M485 250 L442.5 323.6 L357.5 323.6 L315 250 L357.5 176.4 L442.5 176.4 Z" fill="url(#gCore)" filter="url(#soft)"/>
  <path d="M485 250 L442.5 323.6 L357.5 323.6 L315 250 L357.5 176.4 L442.5 176.4 Z" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.35"/>

  <!-- neural network inside core -->
  <g stroke="#FFFFFF" stroke-width="1.6" opacity="0.55">
    <path d="M352 214 L400 226 M352 214 L400 274 M352 250 L400 226 M352 250 L400 274 M352 286 L400 226 M352 286 L400 274"/>
    <path d="M400 226 L448 214 M400 226 L448 250 M400 226 L448 286 M400 274 L448 214 M400 274 L448 250 M400 274 L448 286"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="352" cy="214" r="7"/><circle cx="352" cy="250" r="7"/><circle cx="352" cy="286" r="7"/>
    <circle cx="400" cy="226" r="8"/><circle cx="400" cy="274" r="8"/>
    <circle cx="448" cy="214" r="7"/><circle cx="448" cy="250" r="7"/><circle cx="448" cy="286" r="7"/>
  </g>

  <!-- search input (job title entry) -->
  <g filter="url(#softSm)">
    <rect x="40" y="390" width="250" height="60" rx="30" fill="#FFFFFF"/>
  </g>
  <rect x="40" y="390" width="250" height="60" rx="30" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <g stroke="#4F46E5" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="82" cy="416" r="13"/>
    <path d="M92 426 L102 436"/>
  </g>
  <rect x="122" y="408" width="118" height="10" rx="5" fill="#334155" opacity="0.75"/>
  <rect x="122" y="426" width="72" height="8" rx="4" fill="#94A3B8" opacity="0.7"/>

  <!-- result card (job analysis output) -->
  <g filter="url(#soft)">
    <rect x="520" y="60" width="250" height="210" rx="22" fill="#FFFFFF"/>
  </g>
  <rect x="520" y="60" width="250" height="210" rx="22" fill="none" stroke="#EEF2FF" stroke-width="2"/>
  <!-- briefcase -->
  <g transform="translate(548,86)">
    <rect x="0" y="6" width="34" height="26" rx="6" fill="url(#gCore)"/>
    <path d="M11 6 V3 a4 4 0 0 1 4-4 h4 a4 4 0 0 1 4 4 v3" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
    <rect x="0" y="16" width="34" height="3" fill="#FFFFFF" opacity="0.7"/>
  </g>
  <rect x="594" y="90" width="112" height="11" rx="5.5" fill="#1E293B" opacity="0.8"/>
  <rect x="594" y="108" width="74" height="8" rx="4" fill="#94A3B8" opacity="0.75"/>
  <path d="M548 138 H742" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
  <!-- bars -->
  <g>
    <rect x="552" y="198" width="22" height="42" rx="8" fill="url(#gBar)"/>
    <rect x="588" y="176" width="22" height="64" rx="8" fill="url(#gBar)"/>
    <rect x="624" y="206" width="22" height="34" rx="8" fill="url(#gBar2)"/>
    <rect x="660" y="160" width="22" height="80" rx="8" fill="url(#gBar)"/>
    <rect x="696" y="188" width="22" height="52" rx="8" fill="url(#gBar2)"/>
  </g>
  <path d="M552 252 H742" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>

  <!-- extracted skill tags -->
  <g>
    <rect x="545" y="300" width="96" height="32" rx="16" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/>
    <rect x="563" y="313" width="60" height="7" rx="3.5" fill="#6366F1" opacity="0.65"/>
    <rect x="653" y="300" width="118" height="32" rx="16" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="2"/>
    <rect x="671" y="313" width="82" height="7" rx="3.5" fill="#0891B2" opacity="0.65"/>
    <rect x="575" y="346" width="140" height="32" rx="16" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="2"/>
    <rect x="593" y="359" width="104" height="7" rx="3.5" fill="#7C3AED" opacity="0.6"/>
  </g>

  <!-- sparkles -->
  <g fill="#F59E0B">
    <path d="M286 118 c3 12 6 15 18 18 c-12 3 -15 6 -18 18 c-3 -12 -6 -15 -18 -18 c12 -3 15 -6 18 -18 Z"/>
    <path d="M204 262 c2 8 4 10 12 12 c-8 2 -10 4 -12 12 c-2 -8 -4 -10 -12 -12 c8 -2 10 -4 12 -12 Z" opacity="0.8"/>
  </g>
  <g fill="#06B6D4">
    <path d="M622 436 c2.5 10 5 12.5 15 15 c-10 2.5 -12.5 5 -15 15 c-2.5 -10 -5 -12.5 -15 -15 c10 -2.5 12.5 -5 15 -15 Z" opacity="0.75"/>
  </g>
</svg>
