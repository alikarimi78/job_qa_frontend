<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" role="img" aria-label="Job profile analyzed by AI with orbiting data chips">
  <defs>
    <linearGradient id="bCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="60%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="bAvatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="bBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <radialGradient id="bGlow">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bBlob">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <filter id="bSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4338CA" flood-opacity="0.18"/>
    </filter>
    <filter id="bSoftSm" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4338CA" flood-opacity="0.16"/>
    </filter>
    <clipPath id="avatarClip"><circle cx="400" cy="252" r="36"/></clipPath>
  </defs>

  <!-- atmosphere -->
  <circle cx="150" cy="470" r="140" fill="url(#bBlob)"/>
  <circle cx="400" cy="280" r="250" fill="url(#bGlow)"/>

  <!-- orbit -->
  <circle cx="400" cy="280" r="190" fill="none" stroke="#A78BFA" stroke-width="2" stroke-dasharray="5 11" opacity="0.5"/>
  <circle cx="400" cy="280" r="228" fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="2 14" opacity="0.35"/>
  <g fill="#8B5CF6" opacity="0.5">
    <circle cx="590" cy="280" r="5"/><circle cx="210" cy="280" r="5"/><circle cx="400" cy="470" r="5"/>
  </g>

  <!-- central job profile card -->
  <g filter="url(#bSoft)">
    <rect x="298" y="182" width="204" height="196" rx="28" fill="#FFFFFF"/>
  </g>
  <rect x="298" y="182" width="204" height="196" rx="28" fill="none" stroke="#EEF2FF" stroke-width="2"/>
  <circle cx="400" cy="252" r="36" fill="url(#bAvatar)"/>
  <g clip-path="url(#avatarClip)" fill="#FFFFFF" opacity="0.92">
    <circle cx="400" cy="242" r="13"/>
    <path d="M400 258 c-18 0 -30 12 -33 30 h66 c-3 -18 -15 -30 -33 -30 Z"/>
  </g>
  <rect x="344" y="306" width="112" height="11" rx="5.5" fill="#1E293B" opacity="0.8"/>
  <rect x="366" y="326" width="68" height="8" rx="4" fill="#94A3B8" opacity="0.8"/>
  <g>
    <rect x="336" y="350" width="40" height="8" rx="4" fill="#6366F1" opacity="0.35"/>
    <rect x="382" y="350" width="36" height="8" rx="4" fill="#22D3EE" opacity="0.45"/>
    <rect x="424" y="350" width="40" height="8" rx="4" fill="#A78BFA" opacity="0.45"/>
  </g>

  <!-- AI core badge (top) -->
  <path d="M400 46 L438 68 L438 112 L400 134 L362 112 L362 68 Z" fill="url(#bCore)" filter="url(#bSoftSm)"/>
  <g stroke="#FFFFFF" stroke-width="1.6" opacity="0.6">
    <path d="M382 78 L400 90 M382 102 L400 90 M400 90 L418 78 M400 90 L418 102"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="382" cy="78" r="5"/><circle cx="382" cy="102" r="5"/>
    <circle cx="400" cy="90" r="6"/>
    <circle cx="418" cy="78" r="5"/><circle cx="418" cy="102" r="5"/>
  </g>
  <path d="M400 136 V178" stroke="#A78BFA" stroke-width="3" stroke-dasharray="1 9" stroke-linecap="round" opacity="0.8"/>

  <!-- orbiting data chips -->
  <!-- briefcase -->
  <g filter="url(#bSoftSm)"><circle cx="266" cy="146" r="40" fill="#FFFFFF"/></g>
  <circle cx="266" cy="146" r="40" fill="none" stroke="#EEF2FF" stroke-width="2"/>
  <g transform="translate(249,135)">
    <rect x="0" y="6" width="34" height="24" rx="6" fill="url(#bCore)"/>
    <path d="M11 6 V3 a4 4 0 0 1 4 -4 h4 a4 4 0 0 1 4 4 v3" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
    <rect x="0" y="15" width="34" height="3" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- growth chart -->
  <g filter="url(#bSoftSm)"><circle cx="534" cy="146" r="40" fill="#FFFFFF"/></g>
  <circle cx="534" cy="146" r="40" fill="none" stroke="#EEF2FF" stroke-width="2"/>
  <g>
    <rect x="514" y="148" width="10" height="14" rx="4" fill="url(#bBar)"/>
    <rect x="529" y="138" width="10" height="24" rx="4" fill="url(#bBar)"/>
    <rect x="544" y="128" width="10" height="34" rx="4" fill="url(#bBar)"/>
    <path d="M512 134 L524 126 L536 130 L554 114" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="554" cy="114" r="4" fill="#22D3EE"/>
  </g>

  <!-- salary / coin -->
  <g filter="url(#bSoftSm)"><circle cx="534" cy="414" r="40" fill="#FFFFFF"/></g>
  <circle cx="534" cy="414" r="40" fill="none" stroke="#EEF2FF" stroke-width="2"/>
  <g>
    <ellipse cx="534" cy="426" rx="24" ry="9" fill="#FBBF24"/>
    <rect x="510" y="408" width="48" height="18" fill="#FBBF24"/>
    <ellipse cx="534" cy="408" rx="24" ry="9" fill="#FCD34D"/>
    <ellipse cx="534" cy="408" rx="13" ry="4.6" fill="#F59E0B" opacity="0.55"/>
  </g>

  <!-- education / cap -->
  <g filter="url(#bSoftSm)"><circle cx="266" cy="414" r="40" fill="#FFFFFF"/></g>
  <circle cx="266" cy="414" r="40" fill="none" stroke="#EEF2FF" stroke-width="2"/>
  <g>
    <path d="M266 396 L296 408 L266 420 L236 408 Z" fill="url(#bCore)"/>
    <path d="M246 413 v12 c0 6 9 10 20 10 s20 -4 20 -10 v-12" fill="none" stroke="#6366F1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M296 408 v16" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- sparkles -->
  <g fill="#F59E0B" opacity="0.9">
    <path d="M148 216 c2.6 10.4 5.2 13 15.6 15.6 c-10.4 2.6 -13 5.2 -15.6 15.6 c-2.6 -10.4 -5.2 -13 -15.6 -15.6 c10.4 -2.6 13 -5.2 15.6 -15.6 Z"/>
  </g>
  <g fill="#22D3EE" opacity="0.8">
    <path d="M664 330 c2.2 8.8 4.4 11 13.2 13.2 c-8.8 2.2 -11 4.4 -13.2 13.2 c-2.2 -8.8 -4.4 -11 -13.2 -13.2 c8.8 -2.2 11 -4.4 13.2 -13.2 Z"/>
  </g>
</svg>
